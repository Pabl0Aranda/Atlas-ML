name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Adds a "Run workflow" button on the Actions tab.
  workflow_dispatch:

# The checks only read the code, so the token needs no write access.
permissions:
  contents: read

# A newer push makes a run in progress pointless, so cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Test, check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check types
        run: npm run check

      # Built as GitHub Pages serves it, in the /Atlas-ML subfolder, so the link check
      # sees the real addresses.
      - name: Build the site
        run: npm run build
        env:
          SITE_URL: https://pabl0aranda.github.io
          BASE_PATH: /Atlas-ML

      - name: Check links in the built site
        run: npm run check:links
        env:
          BASE_PATH: /Atlas-ML
